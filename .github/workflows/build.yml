name: Build-Check

on:
  push:
    branches: [main, lokale-assets]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: dist-Inhalt anzeigen
        run: ls -R dist | head -60
